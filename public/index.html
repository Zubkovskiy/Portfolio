<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bohdan Zubkivskiy — Portfolio</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!--
      Every page lives under a locale segment (/en, /ua). This file is the only
      thing at the root, and it forwards to one of them.

      A static host cannot read Accept-Language, so the choice is made here from
      navigator.language instead — the browser-side equivalent of the middleware
      this replaced. All URLs are relative so the page works whether the site is
      served from a domain root or from a /Portfolio sub-path.
    -->
    <script>
      (function () {
        var tag = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        // 'uk' is the language tag for Ukrainian; the URL segment for it is 'ua'.
        var isUk = /^(uk|ua|ru)\b/i.test(tag);
        location.replace(isUk ? './ua/' : './en/');
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=./en/" />
    </noscript>

    <style>
      html {
        background: #0a0a0a;
        color: #f5f5f5;
        font: 16px/1.6 system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      a {
        color: #c9f24a;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecting… <a href="./en/">English</a> · <a href="./ua/">Українська</a>
    </p>
  </body>
</html>
